services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-n8n}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mstworkflow

  n8n:
    build:
      context: ../..
      dockerfile: deploy/phase-0/Dockerfile
    image: mstworkflow/n8n:phase-0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${N8N_PORT:-5678}:5678'
    env_file:
      - .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
    networks:
      - mstworkflow

  mst-agent-service:
    build:
      context: ../../services/mst-agent
      dockerfile: Dockerfile
    image: mstworkflow/mst-agent:latest
    container_name: mst-agent-service
    restart: unless-stopped
    ports:
      - '${AGENT_PORT:-8001}:8000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-n8n}:${POSTGRES_PASSWORD}@postgres:5432/agentdb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mstworkflow

networks:
  mstworkflow:
    driver: bridge
    name: mstworkflow

volumes:
  postgres_data:
