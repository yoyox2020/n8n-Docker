services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run scripts/provision.ps1}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mstworkflow

  n8n:
    build:
      context: ../..
      dockerfile: deploy/phase-0/Dockerfile
    image: mstworkflow/n8n:phase-0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    # env_file passes values directly to the container WITHOUT Compose variable
    # interpolation — required because bcrypt hashes contain literal $ characters
    # that Compose would otherwise try to expand as variable references.
    env_file:
      - .env
    environment:
      # DB connection overrides: these must use Docker service name "postgres"
      # which cannot be known at .env generation time.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
    networks:
      - mstworkflow

networks:
  mstworkflow:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
